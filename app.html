<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Photos</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#6b7280);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btntext:var(--tg-theme-button-text-color,#fff);
  --sec:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --fs:18px;
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#main{padding:10px 14px calc(var(--tabh) + 28px + env(safe-area-inset-bottom))}
h1{font-size:1.4em;margin:6px 0 4px}
h2{font-size:1.15em;margin:18px 0 2px}
.hint{color:var(--hint);font-size:.85em}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.topbar .sp{flex:1}
.topbar button{border:0;background:var(--sec);color:var(--text);border-radius:12px;min-width:44px;min-height:40px;padding:6px 12px;font:inherit;font-size:.8em}
.row{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 10px;padding:10px;border:0;border-radius:16px;background:var(--sec);color:var(--text);font:inherit;text-align:left}
.row img,.row .ph{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#8884;flex:none}
.row b{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
.grid button{padding:0;border:0;background:#8883;aspect-ratio:1;overflow:hidden;border-radius:6px;position:relative}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .star{position:absolute;right:4px;top:2px;font-size:14px}
.cta{display:block;width:100%;min-height:56px;margin:16px 0 0;border:0;border-radius:16px;background:var(--btn);color:var(--btntext);font:inherit;font-weight:700}
.cta.alt{background:var(--sec);color:var(--text)}
.cta[disabled]{opacity:.5}
.msg{padding:14px 16px;border-radius:14px;background:var(--sec);margin:12px 0;white-space:pre-wrap}
.err{background:#e5393522}
.msg .cta.alt{background:var(--bg)}
.foot{margin-top:26px;text-align:center;color:var(--hint);font-size:.7em}
.back{border:0;background:none;color:var(--btn);font:inherit;padding:8px 0;font-weight:600}
.hero{border-radius:18px;background:var(--sec);padding:14px 12px 16px;margin-top:12px}
.hero h2{margin:0}
.spin{text-align:center;padding:40px;color:var(--hint)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid #8883;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;height:var(--tabh);border:0;background:none;color:var(--hint);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 2px}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--btn);font-weight:700}
#viewer{position:fixed;inset:0;background:#000;color:#fff;z-index:10;display:none;touch-action:none;overflow:hidden}
#viewer .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#viewer img{max-width:100%;max-height:100%;transform-origin:center;will-change:transform;-webkit-user-drag:none;user-select:none}
#viewer .cap{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 24px;background:linear-gradient(#000a,#0000);font-size:.8em;text-align:center}
#viewer .bot{position:absolute;left:0;right:0;bottom:0;padding:26px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000c)}
#viewer .btns{display:flex;gap:10px}
#viewer .btns button{flex:1;min-height:54px;border:0;border-radius:14px;background:#ffffff28;color:#fff;font:inherit;font-size:.85em;font-weight:600}
#viewer .copy{margin-top:8px;text-align:center;font-size:.6em;opacity:.7}
#viewer .nav{position:absolute;top:45%;width:52px;height:90px;border:0;background:#0006;color:#fff;font-size:32px;border-radius:14px}
#viewer .prev{left:6px}#viewer .next{right:6px}
label{display:block;margin:14px 0 6px;font-weight:600}
input[type=text],input[type=date],input[type=datetime-local],textarea,select{width:100%;min-height:52px;padding:10px 12px;border-radius:12px;border:2px solid #8885;background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:140px}
.chk{display:flex;gap:12px;align-items:center;margin-top:10px;font-weight:400}
.chk input{width:26px;height:26px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.stat{padding:12px;border-radius:14px;background:var(--sec)}
.stat b{display:block;font-size:1.5em}
.badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:11px;background:#e53935;color:#fff;font-size:.7em;margin-left:8px;text-align:center}
.banner{display:flex;align-items:center;gap:8px;background:var(--btn);color:var(--btntext);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:.85em}
.banner button{margin-left:auto;border:0;background:#fff3;color:inherit;border-radius:10px;padding:6px 12px;font:inherit}
.cta.danger,.danger{background:#e53935;color:#fff}
.card{padding:12px;border-radius:16px;background:var(--sec);margin:0 0 12px}
.card .grid{margin-top:8px}
.card .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.card .btns button,.small{flex:1 1 40%;min-height:46px;border:0;border-radius:12px;background:var(--btn);color:var(--btntext);font:inherit;font-size:.85em;font-weight:600;padding:6px 10px}
.card .btns button.alt{background:var(--bg);color:var(--text)}
.card .btns button.danger{background:#e53935;color:#fff}
.card .btns button[disabled]{opacity:.5}
#viewer .tools{display:flex;gap:8px;margin-bottom:8px}
#viewer .tools button{flex:1;min-height:46px;border:0;border-radius:12px;background:#ffffff28;color:#fff;font:inherit;font-size:.8em;font-weight:600}
#vdlg{position:absolute;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:16px;z-index:3;touch-action:auto;overflow:auto}
#vdlg .box{width:100%;max-width:460px;background:var(--bg);color:var(--text);border-radius:18px;padding:16px}
.file{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--bg);margin:6px 0;font-size:.8em}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .st{flex:none;color:var(--hint);text-align:right;max-width:55%}
.file.bad .st{color:#e53935}
.bar{height:10px;border-radius:5px;background:#8883;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--btn);transition:width .2s}
</style>
</head>
<body>
<div id="main"></div>
<nav id="tabs"></nav>
<div id="viewer">
  <div class="stage"><img id="vimg" alt=""></div>
  <div class="cap" id="vcap"></div>
  <button class="nav prev" id="vprev" aria-label="Previous">‹</button>
  <button class="nav next" id="vnext" aria-label="Next">›</button>
  <div id="vdlg"></div>
  <div class="bot">
    <div class="tools" id="vtools" style="display:none"></div>
    <div class="btns"><button id="vorig">📥 Send me the photo in chat</button><button id="vclose">✖ Close</button></div>
    <div class="copy" id="vcopy"></div>
  </div>
</div>
<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const initData = (tg && tg.initData) || "";
const $main = document.getElementById("main"), $tabs = document.getElementById("tabs");
let HOME = null, tab = "home", stack = [];
let IS_ADMIN = false, adminFam = null, adminFamName = "", dirty = false;  // (the owner's pick lives only in this open app)

// ---------- helpers ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
async function api(path, body) {
  let res;
  if (IS_ADMIN && !path.startsWith("/api/admin/")) body = Object.assign({}, body, { fam: adminFam });
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 60000);  // (a sleeping server can take a while to wake)
  try {
    res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Init-Data": initData }, body: JSON.stringify(body || {}), signal: ctl.signal });
  } catch (e) { throw new Error("No connection, or the server is still waking up. Please wait a moment and try again."); }
  finally { clearTimeout(timer); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const er = new Error(data.error || "Something went wrong. Please try again."); er.exists = !!data.exists; throw er; }
  return data;
}
function haptic() { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
function show(nodes) {
  $main.replaceChildren(...[].concat(nodes).flat().filter(Boolean));
  window.scrollTo(0, 0);
  syncBack();
}
function syncBack() { try { if (stack.length > 1 || viewerOpen()) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {} }
let navId = 0;  // bumped on every navigation, so a slow answer for an old screen is ignored
function loading(t) { navId++; show(h("div", { class: "spin", text: t || "Loading…" })); }
function localToday() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
let confirmOpen = false, busy = false, lastPush = 0;
function confirmAsk(text) {
  if (confirmOpen) return Promise.resolve(false);  // (a second tap can't open a second popup)
  confirmOpen = true;
  return new Promise(res => {
    const done = ok => { confirmOpen = false; res(!!ok); };
    try { tg.showConfirm(text, done); } catch (e) { done(window.confirm(text)); }
  });
}
async function oneAtATime(fn) {  // ignores a second tap while the first action is still running
  if (busy) return;
  busy = true;
  try { await fn(); } finally { busy = false; }
}
function banner() {
  return IS_ADMIN && adminFam != null
    ? h("div", { class: "banner" }, "👁 Viewing the " + adminFamName + " family", h("button", { on: { click: leaveFamily }, text: "🛠 Admin" })) : null;
}
function enterFamily(tid, name) { adminFam = tid; adminFamName = name; HOME = null; setTab("home"); }
function leaveFamily() { adminFam = null; adminFamName = ""; HOME = null; setTab("admin"); }
function redrawCurrent() { const f = stack[stack.length - 1]; if (f) f(); }
function footer() { return h("div", { class: "foot", text: HOME ? HOME.copyright : "" }); }
function errorScreen(e, retry) {
  show([h("h1", { text: "Oops" }), h("div", { class: "msg err", text: e.message || String(e) }),
    retry ? h("button", { class: "cta", on: { click: retry }, text: "Try again" }) : null,
    IS_ADMIN && adminFam != null ? h("button", { class: "cta alt", on: { click: leaveFamily }, text: "🛠 Back to Admin" }) : null]);
}

// navigation: every tab has its own stack of screens
function setTab(name) { navId++; tab = name; stack = [ROOTS[name]]; drawTabs(); ROOTS[name](); }
function push(render) { const now = Date.now(); if (now - lastPush < 400) return; lastPush = now; navId++; stack.push(render); render(); }
function back() {
  if (viewerOpen()) { closeViewer(); return; }
  if (stack.length > 1) { navId++; stack.pop(); stack[stack.length - 1](); }
}
function replaceTop(render) { navId++; stack[stack.length - 1] = render; render(); }  // (swap the current screen, so Back skips it)
function goHome() { setTab("admin"); }
try { tg.BackButton.onClick(back); } catch (e) {}
function backBtn() { return stack.length > 1 ? h("button", { class: "back", on: { click: back }, text: "‹ Back" }) : null; }

// text size (for people who need it bigger)
let size = 18;
try { size = parseInt(localStorage.getItem("fs") || "18", 10) || 18; } catch (e) {}
function applySize() { document.documentElement.style.setProperty("--fs", size + "px"); try { localStorage.setItem("fs", String(size)); } catch (e) {} }
applySize();

function drawTabs() {
  if (!HOME && !IS_ADMIN) { $tabs.replaceChildren(); return; }  // (the owner's tabs differ, so wait to know who this is)
  let defs = [];
  if (IS_ADMIN) defs.push(["admin", "🛠", "Admin"]);
  if (!IS_ADMIN || adminFam != null) {
    defs.push(["home", "🏠", "Home"], ["dates", "📅", "Dates"], ["places", "📍", "Places"], ["all", "🖼", "All"]);
    if (HOME && HOME.best) defs.push(["best", "⭐", "Best"]);
    defs.push(["sug", "💡", "Suggested"]);
  }
  $tabs.replaceChildren(...defs.map(([k, ic, label]) =>
    h("button", { class: k === tab ? "on" : "", on: { click: () => { haptic(); setTab(k); } } }, h("span", { class: "ic", text: ic }), label)));
}

// ---------- home / welcome ----------
let photos = [], viewList = [], homeAt = 0;
async function homeScreen() {
  if (!HOME) {  // (asked once per visit, so the welcome can't change while the app is open)
    if (!initData) { show([h("h1", { text: "Open from Telegram" }), h("div", { class: "msg", text: "Please open this app from the bot in Telegram, using the “📱 Open the photo app” button." })]); return; }
    loading(); const my = navId;
    let got;
    try { got = await api("/api/home"); } catch (e) { if (my === navId) errorScreen(e, homeScreen); return; }
    if (my !== navId) return;  // (they moved on while this was loading)
    HOME = got;
    homeAt = Date.now();
    IS_ADMIN = !!HOME.admin;
    if (IS_ADMIN && adminFam == null) { setTab("admin"); return; }
    drawTabs();
  }
  const w = HOME.welcome;
  const nodes = [
    banner(),
    h("div", { class: "topbar" }, h("div", { class: "sp" }),
      h("button", { on: { click: () => { size = Math.max(14, size - 2); applySize(); } }, "aria-label": "Smaller text", text: "A−" }),
      h("button", { on: { click: () => { size = Math.min(30, size + 2); applySize(); } }, "aria-label": "Bigger text", text: "A+" }),
      h("button", { on: { click: () => push(helpScreen) }, "aria-label": "Help", text: "❓" })),
    h("h1", { text: HOME.first ? "Hi " + HOME.first + "! 👋" : "Hi! 👋" }),
    h("div", { class: "hint", text: HOME.family ? "The " + HOME.family + " family's photos" : "" }),
  ];
  if (!w.items.length) {
    nodes.push(h("div", { class: "msg", text: "No photos here yet. " + (HOME.owner || "The photographer") + " will add them soon!" }));
  } else {
    nodes.push(h("div", { class: "hero" },
      h("h2", { text: w.title }), w.sub ? h("div", { class: "hint", text: w.sub }) : null,
      photoGrid(w.items),
      h("button", { class: "cta", on: { click: () => seeAll(w.mode) }, text: w.mode === "new" ? "See all new photos" : "See all photos" })));
  }
  nodes.push(footer());
  show(nodes);
}
function seeAll(mode) {
  if (mode === "new") push(() => gridScreen("✨ New photos", { mode: "new" }));
  else if (mode === "best") setTab("best");
  else setTab("all");
}
function helpScreen() {
  show([backBtn(), h("h1", { text: "Help" }),
    h("div", { class: "msg", text: HOME.help }),
    h("div", { class: "msg", text: "In this app: use the buttons at the bottom to pick Dates, Places or All photos. Tap a photo to see it full screen. Swipe left or right for the next one, pinch (or double tap) to zoom. “Send me the photo in chat” puts the full-quality photo in your chat with me." }),
    footer()]);
}

// ---------- lists ----------
async function listScreen(title, path, kind) {
  loading(); const my = navId;
  let data;
  try { data = await api(path); } catch (e) { if (my === navId) errorScreen(e, () => listScreen(title, path, kind)); return; }
  if (my !== navId) return;
  const rows = data.rows.map(r => h("button", { class: "row", on: { click: () => push(() => gridScreen(r.label, { mode: kind, value: r.v })) } },
    h("img", { src: r.cover, alt: "", loading: "lazy", on: { error: e => { e.target.style.visibility = "hidden"; } } }),
    h("span", {}, h("b", { text: r.label }), h("span", { class: "hint", text: r.n + (r.n === 1 ? " photo" : " photos") }))));
  show([banner(), h("h1", { text: title }), rows.length ? rows : h("div", { class: "msg", text: "No photos yet. Check back soon!" }), footer()]);
}
const datesScreen = () => listScreen("📅 Pick a date", "/api/dates", "date");
const placesScreen = () => listScreen("📍 Pick a place", "/api/places", "loc");

// ---------- grids ----------
function photoGrid(items) {
  return h("div", { class: "grid" }, items.map((p, i) =>
    h("button", { on: { click: () => { viewList = items; openViewer(i); } }, "aria-label": "Photo " + (i + 1) },
      h("img", { src: p.t, alt: "", loading: "lazy", on: { error: e => { e.target.replaceWith(h("div", { class: "hint", style: "padding:8px", text: "Tap to open" })); } } }),
      p.best ? h("span", { class: "star", text: "⭐" }) : null)));
}
async function gridScreen(title, query, extra) {
  loading(); const my = navId;
  const all = [];
  try { await loadMore(title, query, all, extra); } catch (e) { if (my === navId) errorScreen(e, () => gridScreen(title, query, extra)); }
}
async function loadMore(title, query, all, extra) {
  const my = navId;
  const data = await api("/api/photos", Object.assign({}, query, { skip: all.skip || 0 }));
  if (my !== navId) return;
  const have = new Set(all.map(p => p.id));  // (a photo added meanwhile can shift the pages, so skip repeats)
  all.skip = (all.skip || 0) + data.items.length;
  all.push(...data.items.filter(p => !have.has(p.id)));
  const nodes = [banner(), backBtn(), h("h1", { text: title }), extra || null,
    all.length ? photoGrid(all) : h("div", { class: "msg", text: "No photos here yet." })];
  if (data.more) nodes.push(h("button", { class: "cta alt", on: { click: async (ev) => {
    ev.target.disabled = true; ev.target.textContent = "Loading…";
    const y = window.scrollY;
    try { await loadMore(title, query, all, extra); window.scrollTo(0, y); } catch (e) { ev.target.disabled = false; ev.target.textContent = "Couldn't load. Tap to try again"; }
  } }, text: "Show more photos" }));
  nodes.push(footer());
  show(nodes);
}
function suggestedScreen() {
  const note = IS_ADMIN ? null : h("div", { class: "msg" }, "Photos your family shared and " + ((HOME && HOME.owner) || "the photographer") + " approved. To share your own, open the chat and tap “➕ Suggest photos”.",
    h("button", { class: "cta alt", on: { click: () => { try { tg.close(); } catch (e) {} } }, text: "Open the chat" }));
  gridScreen("💡 Suggested by your family", { mode: "sug" }, note);
}
const ROOTS = {
  home: homeScreen, dates: datesScreen, places: placesScreen,
  all: () => gridScreen("🖼 All photos", { mode: "all" }),
  best: () => gridScreen("⭐ Best shots", { mode: "best" }),
  sug: suggestedScreen,
  admin: () => adminHome(),
};

// ---------- full-screen viewer (swipe, pinch, double-tap) ----------
const V = document.getElementById("viewer"), vimg = document.getElementById("vimg");
let cur = 0, scale = 1, tx = 0, ty = 0;
function viewerOpen() { return V.style.display === "block"; }
function paint() { vimg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function resetZoom() { scale = 1; tx = ty = 0; paint(); }
function openViewer(i) {
  cur = i; dirty = false; V.style.display = "block"; document.body.style.overflow = "hidden";
  document.getElementById("vcopy").textContent = HOME ? HOME.copyright : "";
  try { tg.disableVerticalSwipes(); } catch (e) {}
  syncBack(); showPhoto();
}
function closeViewer() {
  V.style.display = "none"; document.body.style.overflow = ""; vimg.removeAttribute("src");
  document.getElementById("vdlg").style.display = "none";
  try { tg.enableVerticalSwipes(); } catch (e) {}
  syncBack();
  if (dirty) { dirty = false; redrawCurrent(); }  // the owner changed something: show the fresh list
}
function drawTools() {
  const box = document.getElementById("vtools"), p = viewList[cur];
  const show_ = IS_ADMIN && p && !p.sug && p.id != null;
  box.style.display = show_ ? "flex" : "none";
  document.getElementById("vorig").style.display = p && p.sug ? "none" : "";
  if (!show_) return;
  box.replaceChildren(
    h("button", { on: { click: toggleBest }, text: p.best ? "⭐ In Best shots" : "☆ Add to Best" }),
    h("button", { on: { click: editPhoto }, text: "✏️ Edit" }),
    h("button", { on: { click: removePhoto }, text: "🗑 Remove" }));
}
function toggleBest(ev) {
  const p = viewList[cur], b = ev.currentTarget;
  return oneAtATime(async () => {
    b.disabled = true;
    try { const r = await api("/api/admin/photo_best", { id: p.id, best: !p.best }); p.best = r.best; dirty = true; }
    catch (e) { b.textContent = "⚠️ " + e.message; return; }
    if (viewList[cur] === p) drawTools();
  });
}
function removePhoto() {
  const p = viewList[cur];
  return oneAtATime(async () => {
    if (!await confirmAsk("Delete this photo from the group and the family's list? This can't be undone.")) return;
    try { await api("/api/admin/photo_remove", { id: p.id }); }
    catch (e) { document.getElementById("vcap").textContent = "⚠️ " + e.message; return; }
    dirty = true;
    const i = viewList.indexOf(p);  // (they may have swiped while this was running)
    const wasShown = viewList[cur] === p;
    if (i >= 0) viewList.splice(i, 1);
    if (!viewList.length) { closeViewer(); return; }
    if (i >= 0 && i < cur) cur--;
    if (cur >= viewList.length) cur = viewList.length - 1;
    if (wasShown || i < 0) showPhoto(); else drawTools();

// touch: one finger = swipe (or pan when zoomed), two fingers = pinch
let t0 = null, pinch = null, lastTap = 0;
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
V.addEventListener("touchstart", e => {
  if (e.target.closest("button") || e.target.closest("#vdlg")) return;
  if (e.touches.length === 2) { pinch = { d: dist(e.touches[0], e.touches[1]), s: scale }; t0 = null; }
  else if (e.touches.length === 1) { t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty, moved: false }; }
}, { passive: true });
V.addEventListener("touchmove", e => {
  if (pinch && e.touches.length === 2) { scale = Math.max(1, Math.min(5, pinch.s * dist(e.touches[0], e.touches[1]) / pinch.d)); if (scale === 1) tx = ty = 0; paint(); e.preventDefault(); return; }
  if (!t0 || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - t0.x, dy = e.touches[0].clientY - t0.y;
  if (Math.abs(dx) + Math.abs(dy) > 8) t0.moved = true;
  if (scale > 1) { tx = t0.tx + dx; ty = t0.ty + dy; paint(); e.preventDefault(); }
}, { passive: false });
V.addEventListener("touchend", e => {
  if (pinch) { if (e.touches.length < 2) pinch = null; return; }
  if (!t0) return;
  const dx = e.changedTouches[0].clientX - t0.x, dy = e.changedTouches[0].clientY - t0.y, t = t0; t0 = null;
  if (scale === 1 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) { step(dx < 0 ? 1 : -1); return; }
  if (scale === 1 && dy > 110 && Math.abs(dy) > Math.abs(dx) * 1.5) { closeViewer(); return; }
  if (!t.moved) {  // a tap; two quick taps zoom
    const now = Date.now();
    if (now - lastTap < 320) { if (scale > 1) resetZoom(); else { scale = 2.5; tx = ty = 0; paint(); } lastTap = 0; } else lastTap = now;
  }
});
document.addEventListener("keydown", e => { if (!viewerOpen()) return; if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "Escape") closeViewer(); });

        fam.families.map(f => h("option", { value: String(f.tid), text: f.name + " family" })));
      if (t.guess) sel.value = String(t.guess.tid);
      const run = (path, body, ask) => oneAtATime(async () => {
        if (ask && !await confirmAsk(ask)) return;
        try { const r = await api(path, body); if (r.message) await alertMsg("✅ " + r.message); }
        catch (e) { await alertMsg("⚠️ " + e.message); }
        reload();
      });
      return h("div", { class: "card" },
        h("b", { text: t.tg || t.label }), t.username ? " @" + t.username : "",
        h("div", { class: "hint", text: "Typed: “" + (t.first || "-") + " " + (t.last || "-") + "” · " + t.reason + " · " + t.count + "× · last " + t.at }),
        t.lock ? h("div", { class: "hint", text: "🔒 Locked out for about " + t.lock + " more minute(s)" }) : null,
        h("label", { text: t.guess ? "Looks like the " + t.guess.name + " family" : "Add to which family?" }), sel,
        h("div", { class: "btns" },
          h("button", { text: "✅ Add them", on: { click: () => {
            if (!sel.value) { alertMsg("Please pick a family first."); return; }
            run("/api/admin/try_add", { uid: t.uid, tid: parseInt(sel.value, 10) },
              "Add " + (t.first || t.tg || "this person") + " to the " + sel.selectedOptions[0].text + "?");
          } } }),
          t.lock ? h("button", { class: "alt", text: "🔓 Clear lockout", on: { click: () => run("/api/admin/try_unlock", { uid: t.uid }) } }) : null,
          h("button", { class: "alt", text: "🗑 Dismiss", on: { click: () => run("/api/admin/try_dismiss", { uid: t.uid }) } })));
    }) : h("div", { class: "msg", text: "Nobody has tried to log in recently." }),
    d.rows.length ? h("button", { class: "cta alt", text: "Clear the whole list", on: { click: () => oneAtATime(async () => {
      if (!await confirmAsk("Clear the list? Nobody is unlinked or unlocked, it just empties the list.")) return;
      try { await api("/api/admin/tries_clear", {}); } catch (e) {}
      reload();
    }) } }) : null,
    footer()]);
}

// adding photos (one at a time, as files so the quality is kept)
const UPLOAD_MAX = 30 * 1024 * 1024;
const IMG_NAME = /\.(heic|heif|jpe?g|png|webp|gif)$/i;
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
function newKey() { let k = ""; for (let i = 0; i < 24; i++) k += Math.floor(Math.random() * 36).toString(36); return k; }
async function uploadOne(file, meta, key, signal) {
  const q = new URLSearchParams({ fam: String(meta.fam), place: meta.place, date: meta.date, name: file.name || "photo" });
  let res;
  try {
    res = await fetch("/api/admin/upload?" + q, { method: "POST", signal, body: file,
      headers: { "X-Init-Data": initData, "X-Upload-Key": key, "Content-Type": file.type || "application/octet-stream" } });
  } catch (e) { throw new Error(signal.aborted ? "Stopped" : "No connection. Check your internet, then tap Retry."); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const er = new Error(data.error || "Upload failed."); er.maybe = !!data.maybe; throw er; }
  return data;
}
function uploadScreen(pre) {
  adminLoad("/api/admin/overview", {}, () => uploadScreen(pre)).then(d => { if (d) drawUpload(pre, d.families); });
}
function drawUpload(pre, families) {
  const my = navId;
  let items = [], running = false, ctl = null, stopFlag = false, doneFam = null;
  const sel = h("select", {}, h("option", { value: "", text: "Pick a family…" }),
    families.map(f => h("option", { value: String(f.tid), text: f.name + " family" })));
  if (pre != null) sel.value = String(pre);
  const place = h("input", { type: "text", maxlength: "80", placeholder: "Leave empty if you don't know" });
  const day = h("input", { type: "date", max: localToday() });
  const idk = h("input", { type: "checkbox" });
  idk.addEventListener("change", () => { day.disabled = idk.checked; });
  const pick = h("input", { type: "file", accept: "image/*,.heic,.heif", multiple: "multiple", style: "display:none" });
  const list = h("div", {}), msg = h("div", { class: "hint", text: "" }), bar = h("i"), summary = h("div", {});
  const start = h("button", { class: "cta", text: "⬆️ Upload", on: { click: () => run(false) } });
  const stop = h("button", { class: "cta alt", text: "Stop", style: "display:none", on: { click: () => { stopFlag = true; if (ctl) ctl.abort(); } } });
  const choose = h("button", { class: "cta alt", text: "📷 Choose photos", on: { click: () => pick.click() } });
  const wait = items_ => items_.filter(i => i.state === "ready" || i.state === "fail");
  function paint() {
    list.replaceChildren(...items.map(it => h("div", { class: "file" + (it.state === "fail" || it.state === "skip" ? " bad" : "") },
      h("span", { class: "nm", text: it.file.name || "photo" }),
      h("span", { class: "st", text: it.state === "done" ? "✅" : it.state === "up" ? "⏳ uploading…" : it.state === "ready" ? fmtSize(it.file.size)
        : "⚠️ " + it.msg }))));
    const todo = wait(items).length, failed = items.filter(i => i.state === "fail").length;
    start.textContent = running ? "Uploading…" : failed && todo === failed ? "🔁 Retry the " + failed + " that didn't go through"
      : "⬆️ Upload " + todo + (todo === 1 ? " photo" : " photos");
    start.disabled = running || !todo;
    stop.style.display = running ? "" : "none";
    choose.disabled = running;
    const done = items.filter(i => i.state === "done").length;
    const total = items.filter(i => i.state !== "skip").length;
    bar.style.width = total ? Math.round(100 * done / total) + "%" : "0";
  }
  pick.addEventListener("change", () => {
    const have = new Set(items.map(i => i.file.name + "|" + i.file.size + "|" + i.file.lastModified));
    for (const f of pick.files) {
      const k = f.name + "|" + f.size + "|" + f.lastModified;
      if (have.has(k)) continue;
      have.add(k);
      const it = { file: f, key: newKey(), state: "ready", msg: "" };
      if (!(f.type || "").startsWith("image/") && !IMG_NAME.test(f.name || "")) { it.state = "skip"; it.msg = "not a photo"; }
      else if (f.size > UPLOAD_MAX) { it.state = "skip"; it.msg = "over 30 MB: send it through the chat"; }
      else if (!f.size) { it.state = "skip"; it.msg = "empty file"; }
      items.push(it);
    }
    pick.value = "";
    paint();
  });
  async function run() {
    msg.textContent = "";
    if (!sel.value) { msg.textContent = "⚠️ Please pick the family first."; return; }
    if (!idk.checked && !day.value) { msg.textContent = "⚠️ Please pick the date, or tick “I don't know the date”."; return; }
    const meta = { fam: parseInt(sel.value, 10), place: place.value, date: idk.checked ? "unknown" : day.value };
    const famName = sel.selectedOptions[0].text;
    running = true; stopFlag = false; paint();
    for (const it of items.filter(i => i.state === "ready" || i.state === "fail")) {
      if (stopFlag) break;
      it.state = "up"; paint();
      ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 600000);
      try { await uploadOne(it.file, meta, it.key, ctl.signal); it.state = "done"; doneFam = meta.fam; }
      catch (e) {
        it.state = "fail"; it.msg = e.message;
        if (e.maybe) it.key = newKey();  // (it may already be in the group: a retry is the owner's call)
      }
      clearTimeout(timer);
      paint();
    }
    running = false; ctl = null; paint();
    const done = items.filter(i => i.state === "done").length, failed = items.filter(i => i.state === "fail").length;
    summary.replaceChildren(...(done ? [
      h("div", { class: "msg", text: "✅ " + done + (done === 1 ? " photo" : " photos") + " added to the " + famName + "." + (failed ? " " + failed + " didn't go through." : "") + (stopFlag ? " (Stopped.)" : "") }),
      h("button", { class: "cta alt", text: "📸 Browse their photos", on: { click: () => enterFamily(meta.fam, famName.replace(/ family$/, "")) } })] : []));
  }
  show([backBtn(), h("h1", { text: "📤 Add photos" }),
    h("label", { text: "Family" }), sel,
    h("label", { text: "📍 Place" }), place,
    h("label", { text: "📅 Date" }), day, h("label", { class: "chk" }, idk, "I don't know the date"),
    h("div", { class: "hint", style: "margin-top:12px", text: "Photos go up as files, so the full quality is kept. Up to 30 MB each. For bigger files, send them through the chat." }),
    choose, pick, list, h("div", { class: "bar" }, bar), msg, start, stop, summary, footer()]);
  paint();
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && HOME && !viewerOpen() && Date.now() - homeAt > 3600 * 1000) { HOME = null; setTab("home"); }
});
setTab("home");
